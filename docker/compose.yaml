name: im-dev

services:
  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "127.0.0.1:${IM_FRONTEND_PORT:-8081}:80"
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    environment:
      GIN_MODE: release
      IM_HTTP_ADDR: 0.0.0.0:8080
      IM_JWT_SECRET: ${IM_JWT_SECRET:?Set IM_JWT_SECRET in docker/.env}
      IM_ROCKETMQ_NAMESRV: rocketmq-namesrv:9876
      IM_MYSQL_DSN: ${IM_MYSQL_USER:-im_dev}:${IM_MYSQL_PASSWORD:?Set IM_MYSQL_PASSWORD in docker/.env}@tcp(mysql:3306)/${IM_MYSQL_DATABASE:-im}
    ports:
      - "127.0.0.1:${IM_BACKEND_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      rocketmq-topic:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${IM_MYSQL_ROOT_PASSWORD:?Set IM_MYSQL_ROOT_PASSWORD in docker/.env}
      MYSQL_DATABASE: ${IM_MYSQL_DATABASE:-im}
      MYSQL_USER: ${IM_MYSQL_USER:-im_dev}
      MYSQL_PASSWORD: ${IM_MYSQL_PASSWORD:?Set IM_MYSQL_PASSWORD in docker/.env}
    ports:
      - "127.0.0.1:${IM_MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u \"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e \"SELECT 1\""]
      interval: 5s
      timeout: 4s
      retries: 15
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:${IM_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rocketmq-namesrv:
    image: apache/rocketmq:5.3.4
    command: ["nameserver"]
    environment:
      JAVA_OPT_EXT: -Xms256m -Xmx256m -Xmn128m
    healthcheck:
      test: ["CMD", "bash", "-c", ": </dev/tcp/127.0.0.1/9876"]
      interval: 5s
      timeout: 3s
      retries: 12

  rocketmq-broker:
    image: im-rocketmq-broker:5.3.4
    build:
      context: ..
      dockerfile: docker/rocketmq-broker.Dockerfile
    command: ["broker", "-n", "rocketmq-namesrv:9876", "-c", "/etc/rocketmq/broker.conf"]
    environment:
      JAVA_OPT_EXT: -Xms512m -Xmx512m -Xmn256m -XX:MaxDirectMemorySize=512m
    volumes:
      - rocketmq-data:/home/rocketmq/store
      - ./rocketmq-broker.conf:/etc/rocketmq/broker.conf:ro
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "sh mqadmin clusterList -n rocketmq-namesrv:9876 | grep -q im-broker"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 15s

  rocketmq-topic:
    image: apache/rocketmq:5.3.4
    entrypoint: ["sh", "mqadmin"]
    command: ["updateTopic", "-n", "rocketmq-namesrv:9876", "-c", "im-local", "-t", "im_redpacket_events"]
    depends_on:
      rocketmq-broker:
        condition: service_healthy

volumes:
  rocketmq-data:
  mysql-data:
  redis-data:
